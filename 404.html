<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Lost in the Pixels | PixelShrink</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        color: #f8fafc;
        background:
          radial-gradient(circle at 20% 10%, rgba(124, 92, 255, 0.18), transparent 30%),
          radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.08), transparent 25%),
          #080b12;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: linear-gradient(to bottom, black, transparent 80%);
      }

      #message {
        position: relative;
        background: rgba(18, 23, 35, 0.78);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 55px 40px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.2);
        z-index: 1;
      }

      .icon-wrapper {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: rgba(124, 92, 255, 0.14);
        color: #b7a6ff;
        font-size: 28px;
      }

      h2 {
        color: #9b83ff;
        font-size: 52px;
        font-weight: 800;
        margin: 0 0 10px;
        letter-spacing: -2px;
      }

      h1 {
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
      }

      p {
        color: #8b95a7;
        line-height: 1.6;
        margin: 0 0 32px;
        font-size: 15px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        height: 50px;
        text-decoration: none;
        color: white;
        background: linear-gradient(135deg, #7c5cff, #6355d9);
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 10px 25px rgba(124, 92, 255, 0.2);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 35px rgba(124, 92, 255, 0.3);
      }

      @media (max-width: 480px) {
        #message {
          padding: 40px 25px;
        }
      }
    </style>
  </head>
  <body>
    <div id="message">
      <div class="icon-wrapper">
        <i class="fas fa-ghost"></i>
      </div>
      <h2>404</h2>
      <h1>Lost in the pixels</h1>
      <p>The page you are looking for has been heavily compressed or doesn't exist anymore.</p>
      
      <a href="/" class="btn">
        <i class="fas fa-arrow-left"></i> Back to Compressor
      </a>
    </div>
  </body>
</html>
