<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="630"
    viewBox="0 0 1200 630"
>

    <defs>

        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#080b12"
            />

            <stop
                offset="100%"
                stop-color="#171027"
            />

        </linearGradient>


        <linearGradient
            id="purple"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >

            <stop
                offset="0%"
                stop-color="#a78bfa"
            />

            <stop
                offset="100%"
                stop-color="#6d28d9"
            />

        </linearGradient>

    </defs>


    <rect
        width="1200"
        height="630"
        fill="url(#background)"
    />


    <circle
        cx="1000"
        cy="100"
        r="250"
        fill="#7c3aed"
        opacity="0.08"
    />


    <circle
        cx="200"
        cy="600"
        r="300"
        fill="#7c3aed"
        opacity="0.05"
    />


    <!-- Logo -->

    <rect
        x="100"
        y="105"
        width="74"
        height="74"
        rx="20"
        fill="url(#purple)"
    />


    <text
        x="137"
        y="154"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="800"
        fill="white"
    >
        ✦
    </text>


    <!-- Brand -->

    <text
        x="195"
        y="158"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="800"
        fill="white"
    >
        PixelShrink
    </text>


    <!-- Main -->

    <text
        x="100"
        y="285"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="800"
        fill="white"
    >
        Compress Images.
    </text>


    <text
        x="100"
        y="355"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="800"
        fill="#a78bfa"
    >
        Keep the Quality.
    </text>


    <text
        x="100"
        y="425"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        fill="#94a3b8"
    >
        Free online image compressor &amp; resizer
    </text>


    <!-- Privacy -->

    <rect
        x="100"
        y="485"
        width="300"
        height="48"
        rx="24"
        fill="#7c3aed"
        opacity="0.12"
    />


    <text
        x="250"
        y="516"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="700"
        fill="#c4b5fd"
    >
        🔒 Your images stay private
    </text>

</svg>